<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18453B" />
      <stop offset="100%" stop-color="#0F2F25" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D780" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Crescent Moon -->
  <path d="M256 64 C150 64 64 150 64 256 C64 362 150 448 256 448 C342 448 415 391 440 312 C395 365 329 398 256 398 C177 398 114 335 114 256 C114 183 147 117 200 72 C218 84 236 64 256 64 Z" fill="url(#goldGrad)"/>

  <!-- Mosque Silhouette -->
  <!-- Main Dome -->
  <path d="M256 160 C210 200 200 240 200 300 L312 300 C312 240 302 200 256 160 Z" fill="#FFFFFF"/>
  <rect x="200" y="300" width="112" height="98" fill="#FFFFFF"/>
  <!-- Main Door -->
  <path d="M256 330 C240 330 230 350 230 398 L282 398 C282 350 272 330 256 330 Z" fill="#18453B"/>
  
  <!-- Left Minaret -->
  <rect x="160" y="220" width="16" height="178" fill="#FFFFFF"/>
  <path d="M168 180 L180 220 L156 220 Z" fill="url(#goldGrad)"/>
  <circle cx="168" cy="175" r="4" fill="url(#goldGrad)"/>

  <!-- Right Minaret -->
  <rect x="336" y="220" width="16" height="178" fill="#FFFFFF"/>
  <path d="M344 180 L356 220 L332 220 Z" fill="url(#goldGrad)"/>
  <circle cx="344" cy="175" r="4" fill="url(#goldGrad)"/>

  <!-- Clock / Time Indicator Elements -->
  <!-- Top Marker -->
  <polygon points="250,80 262,80 256,120" fill="url(#goldGrad)"/>
  <!-- Subtle tick marks -->
  <rect x="254" y="130" width="4" height="10" fill="url(#goldGrad)"/>
  
  <rect x="310" y="90" width="4" height="10" transform="rotate(30 312 95)" fill="url(#goldGrad)"/>
  <rect x="350" y="120" width="4" height="10" transform="rotate(60 352 125)" fill="url(#goldGrad)"/>
  
  <rect x="200" y="90" width="4" height="10" transform="rotate(-30 202 95)" fill="url(#goldGrad)"/>
  <rect x="160" y="120" width="4" height="10" transform="rotate(-60 162 125)" fill="url(#goldGrad)"/>
</svg>
